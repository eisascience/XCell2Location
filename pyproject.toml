[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xcell2location"
version = "0.1.0"
description = "Cross-platform spatial transcriptomics analysis platform centered on cell2location"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "XCell2Location Contributors" },
]
keywords = ["spatial-transcriptomics", "cell2location", "seurat", "single-cell"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "anndata>=0.9.2,<0.11",
    "scanpy>=1.9.6,<1.11",
    "numpy>=1.24.0,<2.0",
    "pandas>=1.5.3,<2.2",
    "pyarrow>=12.0.0,<16",
    "scipy>=1.10.0,<1.14",
    "matplotlib>=3.7.0,<3.10",
    "seaborn>=0.12.2,<0.14",
    "scikit-learn>=1.2.2,<1.5",
    "pydantic>=2.0.0,<3.0",
    "pyyaml>=6.0",
    "typer[all]>=0.9.0,<0.13",
    "rich>=13.0.0",
    "streamlit>=1.28.0,<1.35",
    "plotly>=5.15.0,<5.23",
]

[project.optional-dependencies]
ml = [
    "cell2location>=0.1.3",
    "scvi-tools>=1.0.4,<1.2",
    "torch>=2.0.1,<2.3",
]
r = [
    "rpy2>=3.5.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "black>=23.7.0",
    "pre-commit>=3.3.3",
]

[project.scripts]
spx = "app.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py310"
line-length = 100
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in default arguments
    "B904",  # raise from inside except
]

[tool.ruff.per-file-ignores]
"tests/**" = ["S101"]  # allow assert in tests

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["tests/", "scripts/", "docs/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --cov=app --cov-report=term-missing --cov-report=html"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
